<app-navbar></app-navbar>

<app-header titulo="Gestión de Stock"></app-header>

<div class="container mt-3 mb-5 pb-5">
  
  <!-- Barra de búsqueda -->
  <app-search 
    placeholder="Buscar productos por nombre o categoría..."
    [(terminoBusqueda)]="terminoBusqueda"
    (busquedaRealizada)="onBusqueda($event)">
  </app-search>

  <!-- Filtros por disponibilidad -->
  <div class="mb-4">
    <button 
      class="btn btn-sm me-2"
      [ngClass]="filtroDisponibilidad === 'todos' ? 'btn-primary' : 'btn-outline-secondary'"
      (click)="cambiarFiltroDisponibilidad('todos')">
      <i class="bi bi-list-ul"></i> Todos
    </button>
    <button 
      class="btn btn-sm me-2"
      [ngClass]="filtroDisponibilidad === 'disponible' ? 'btn-success' : 'btn-outline-success'"
      (click)="cambiarFiltroDisponibilidad('disponible')">
      <i class="bi bi-check-circle"></i> Disponible
    </button>
    <button 
      class="btn btn-sm"
      [ngClass]="filtroDisponibilidad === 'no disponible' ? 'btn-danger' : 'btn-outline-danger'"
      (click)="cambiarFiltroDisponibilidad('no disponible')">
      <i class="bi bi-x-circle"></i> No disponible
    </button>
  </div>

  <!-- Mensaje de carga -->
  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2">Cargando productos...</p>
  </div>

  <!-- Lista de productos -->
  <div *ngIf="!cargando && productosFiltrados.length > 0">
    <div class="row g-3">
      <div class="col-12 col-sm-6 col-lg-4" *ngFor="let p of productosFiltrados">
        <app-card-producto
          [id]="p.id"
          [nombre]="p.nombre"
          [categoria]="p.categoria"
          [precio]="p.precio"
          [imagen]="p.imagen"
          [disponible]="p.disponible">
          
          <!-- Checkbox de disponibilidad -->
          <div class="form-check mt-2">
            <input 
              type="checkbox" 
              class="form-check-input" 
              [id]="'disponible-' + p.id"
              [(ngModel)]="p.disponible"
              (ngModelChange)="cambiarDisponibilidad(p)"
              [name]="'disponible-' + p.id">
            <label class="form-check-label" [for]="'disponible-' + p.id">
              <strong>{{ p.disponible ? 'Disponible' : 'No disponible' }}</strong>
            </label>
          </div>
          
        </app-card-producto>
      </div>
    </div>

    <!-- Componente de paginación -->
    <app-pagination
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      [totalItems]="totalItems"
      (pageChange)="onPageChange($event)">
    </app-pagination>
  </div>

  <!-- Mensaje cuando no hay productos -->
  <div *ngIf="!cargando && productosFiltrados.length === 0" class="alert alert-info text-center">
    <i class="bi bi-info-circle"></i> 
    No hay productos registrados en el sistema.
  </div>
  
</div>
