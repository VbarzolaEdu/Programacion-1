<app-navbar></app-navbar>

<!-- Header -->
<app-header titulo="Estado de Pedidos"></app-header>

<!-- Lista de Pedidos -->
<div class="container my-4">
  
  <!-- Filtros de búsqueda -->
  <app-date-search 
    (fechaSeleccionada)="filtrarPorFecha($event)">
  </app-date-search>

  <app-estado-filter
    (estadoSeleccionado)="filtrarPorEstado($event)">
  </app-estado-filter>
  
  <!-- Mensaje de carga -->
  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2">Cargando pedidos...</p>
  </div>

  <!-- Lista de pedidos -->
  <div *ngIf="!cargando && pedidos.length > 0">
    <div *ngFor="let p of pedidos" class="mb-3">
    <app-card-pedido
      [id]="p.id"
      [fecha]="p.fecha"
      [total]="p.total"
      [estado]="p.estado"
      [cliente]="p.cliente"
      [imagen]="p.imagen"
      [comentario]="p.comentario"
      [productos]="p.productos">
      
      <!-- Información extra específica del empleado -->
      <div extra-info>
        <p class="mb-1"><strong># Pedido:</strong> {{ p.id }}</p>
      </div>

      <!-- Botones de acción del empleado -->
      <div class="d-flex flex-column flex-sm-row gap-2">
        <button 
          class="btn btn-warning btn-sm text-white w-100" 
          (click)="cambiarEstado(p, '  En Preparación')">
          <i class="bi bi-clock-history"></i> <span class="d-none d-sm-inline">En Preparación</span><span class="d-sm-none">Preparando</span>
        </button>
        <button 
          class="btn btn-success btn-sm w-100" 
          (click)="cambiarEstado(p, '  Listo')">
          <i class="bi bi-check-circle"></i> Listo
        </button>
        <button 
          class="btn btn-danger btn-sm w-100" 
          (click)="cambiarEstado(p, ' Rechazado')">
          <i class="bi bi-x-circle"></i> Rechazar
        </button>
      </div>
    </app-card-pedido>
    </div>

    <!-- Componente de paginación -->
    <app-pagination
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      [totalItems]="totalItems"
      (pageChange)="onPageChange($event)">
    </app-pagination>
  </div>

  <!-- Mensaje cuando no hay pedidos -->
  <div *ngIf="!cargando && pedidos.length === 0" class="alert alert-info text-center">
    <i class="bi bi-info-circle"></i> 
    No hay pedidos registrados en este momento.
  </div>
</div>
