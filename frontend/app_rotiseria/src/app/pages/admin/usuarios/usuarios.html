<app-navbar></app-navbar>

<app-header titulo="Usuarios"></app-header>

<div class="container mt-3 mb-5">
  <app-card-usuario
    *ngFor="let u of usuarios"
    [nombre]="u.nombre"
    [correo]="u.correo"
    [rol]="u.rol">
    <!-- Botón específico del admin -->
    <button class="btn btn-danger btn-sm" (click)="eliminarUsuario(u)">
      <i class="bi bi-trash"></i> Eliminar
    </button>
  </app-card-usuario>
</div>
