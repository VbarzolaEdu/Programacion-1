<app-navbar></app-navbar>

<app-header titulo="Usuarios"></app-header>

<div class="container mt-3 mb-5 pb-5">
  
  <!-- Barra de búsqueda -->
  <app-search 
    placeholder="Buscar por nombre, apellidos o email..."
    [(terminoBusqueda)]="terminoBusqueda"
    (busquedaRealizada)="aplicarFiltros()">
  </app-search>

  <!-- Mensaje de carga -->
  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2">Cargando usuarios...</p>
  </div>

  <!-- Lista de usuarios filtrados -->
  <div *ngIf="!cargando && usuariosFiltrados.length > 0">
    <div class="mb-3" *ngFor="let u of usuariosFiltrados">
      <app-card-usuario
        [nombre]="u.nombre + ' ' + u.apellidos"
        [email]="u.email"
        [rol]="u.rol">
        <!-- Botones específicos del admin -->
        <div class="d-flex gap-2 flex-wrap">
          <!-- Botones para cambiar rol -->
          <div class="btn-group btn-group-sm" role="group">
            <button 
              type="button" 
              class="btn btn-sm"
              [class.btn-primary]="u.rol === 'cliente'"
              [class.btn-outline-primary]="u.rol !== 'cliente'"
              (click)="cambiarRol(u, 'cliente')"
              title="Cambiar a Cliente">
              <i class="bi bi-person"></i> Cliente
            </button>
            <button 
              type="button" 
              class="btn btn-sm"
              [class.btn-warning]="u.rol === 'empleado'"
              [class.btn-outline-warning]="u.rol !== 'empleado'"
              (click)="cambiarRol(u, 'empleado')"
              title="Cambiar a Empleado">
              <i class="bi bi-person-workspace"></i> Empleado
            </button>
            <button 
              type="button" 
              class="btn btn-sm"
              [class.btn-success]="u.rol === 'admin'"
              [class.btn-outline-success]="u.rol !== 'admin'"
              (click)="cambiarRol(u, 'admin')"
              title="Cambiar a Admin">
              <i class="bi bi-person-fill-gear"></i> Admin
            </button>
          </div>
          
          <!-- Botón eliminar -->
          <button class="btn btn-danger btn-sm" (click)="eliminarUsuario(u)">
            <i class="bi bi-trash-fill"></i> Eliminar
          </button>
        </div>
      </app-card-usuario>
    </div>

    <!-- Componente de paginación -->
    <app-pagination
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      [totalItems]="totalItems"
      (pageChange)="onPageChange($event)">
    </app-pagination>
  </div>

  <!-- Mensaje cuando no hay usuarios -->
  <div *ngIf="!cargando && usuariosFiltrados.length === 0" class="alert alert-info text-center">
    <i class="bi bi-info-circle"></i> 
    <span *ngIf="terminoBusqueda">No se encontraron usuarios con "{{ terminoBusqueda }}"</span>
    <span *ngIf="!terminoBusqueda">No hay usuarios registrados en el sistema.</span>
  </div>
</div>
