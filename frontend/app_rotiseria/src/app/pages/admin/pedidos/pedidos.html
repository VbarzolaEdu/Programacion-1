<app-navbar></app-navbar>

<!-- Header -->
<app-header titulo="Historial de pedidos"></app-header>

<!-- Filtro -->
<div class="container my-3 mb-5 pb-5">
  
  <!-- Mensaje de carga -->
  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2">Cargando pedidos...</p>
  </div>

  <!-- Contenido cuando termina de cargar -->
  <div *ngIf="!cargando">
    
    <!-- Formulario de Edición -->
    <div *ngIf="modoEdicion && pedidoEditando">
      <app-form
        [titulo]="'Editar Pedido #' + pedidoEditando.id"
        [datos]="pedidoTemporal"
        [mostrarCampos]="['precio_final', 'estado', 'fecha']"
        [estadoOpciones]="['En preparación', 'Listo', 'Rechazado']"
        (guardar)="guardarCambios($event)"
        (cancelar)="cancelarEdicion()">
      </app-form>
    </div>

    <!-- Filtro de fecha (oculto en modo edición) -->
    <app-date-search 
      [ocultarFiltro]="modoEdicion"
      (fechaSeleccionada)="filtrarPorFecha($event)">
    </app-date-search>

    <!-- Filtro de estado (oculto en modo edición) -->
    <app-estado-filter
      [ocultarFiltro]="modoEdicion"
      (estadoSeleccionado)="filtrarPorEstado($event)">
    </app-estado-filter>

    <!-- Lista de Pedidos (oculta en modo edición) -->
    <div *ngIf="!modoEdicion && pedidosFiltrados.length > 0">
      <div *ngFor="let p of pedidosFiltrados" class="mb-3">
        <app-card-pedido
          [id]="p.id"
          [fecha]="p.fecha"
          [total]="p.total"
          [estado]="p.estado"
          [cliente]="p.cliente"
          [imagen]="p.imagen"
          [comentario]="p.comentario"
          [productos]="p.productos">
          
          <!-- Información extra específica del admin -->
          <div extra-info>
            <p class="mb-1"><strong># Pedido:</strong> {{ p.id }}</p>
          </div>

          <!-- Botones de acción del admin -->
          <div class="d-flex gap-2">
            <button 
              class="btn btn-warning btn-sm" 
              (click)="editarPedido(p)">
              <i class="bi bi-pencil-fill"></i> Editar
            </button>
            <button 
              class="btn btn-danger btn-sm" 
              (click)="eliminarPedido(p)">
              <i class="bi bi-trash-fill"></i> Eliminar
            </button>
          </div>
        </app-card-pedido>
      </div>

      <!-- Componente de paginación -->
      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [totalItems]="totalItems"
        (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>

    <!-- Mensaje si no hay pedidos -->
    <div *ngIf="pedidosFiltrados.length === 0" class="alert alert-info text-center">
      <i class="bi bi-info-circle"></i> 
      <span *ngIf="fechaFiltro">No se encontraron pedidos para la fecha seleccionada.</span>
      <span *ngIf="!fechaFiltro">No hay pedidos registrados en el sistema.</span>
    </div>
  </div>
</div>
