<app-navbar></app-navbar>
<app-header titulo="Mi Perfil"></app-header>

<div class="container mt-3 mb-5 pb-5">
  
  <!-- Mensaje de carga -->
  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2">Cargando perfil...</p>
  </div>

  <!-- Vista del perfil (modo lectura) -->
  <div *ngIf="!cargando && usuario && !modoEdicion">
    <app-card-usuario
      [nombre]="usuario.nombre + ' ' + usuario.apellidos"
      [email]="usuario.email"
      [rol]="usuario.rol">
      
      <!-- Información extra del perfil -->
      <div extra-info>
        <p class="mb-1"><strong>Teléfono:</strong> {{ usuario.cellphone }}</p>
        <p class="mb-1"><strong>Estado:</strong> 
          <span 
            class="badge"
            [ngClass]="{
              'bg-success': usuario.estado === 'activo' || usuario.estado === 'Activo' || usuario.estado === 'validado',
              'bg-warning text-dark': usuario.estado === 'pendiente' || usuario.estado === 'Pendiente',
              'bg-danger': usuario.estado === 'bloqueado' || usuario.estado === 'Bloqueado'
            }">
            {{ usuario.estado }}
          </span>
        </p>
      </div>

      <!-- Botón para activar edición -->
      <button class="btn btn-warning w-100" (click)="activarEdicion()">
        <i class="bi bi-pencil-fill"></i> Editar perfil
      </button>
    </app-card-usuario>
  </div>

  <!-- Formulario de edición (modo edición) -->
  <div *ngIf="!cargando && usuario && modoEdicion">
    <app-form
      [titulo]="'Editar Perfil'"
      [datos]="usuario"
      [camposReadOnly]="{ rol: usuario.rol, estado: usuario.estado }"
      [mostrarCampos]="['nombre', 'apellidos', 'email', 'cellphone']"
      (guardar)="guardarCambios($event)"
      (cancelar)="cancelarEdicion()">
    </app-form>
  </div>

  <!-- Mensaje si no hay datos -->
  <div *ngIf="!cargando && !usuario" class="alert alert-warning text-center">
    <i class="bi bi-exclamation-triangle"></i> No se pudo cargar tu perfil. Por favor, intenta nuevamente.
  </div>
</div>
