<app-navbar></app-navbar>

<app-header titulo="Home"></app-header>

<div class="container mt-3 mb-5 pb-5">
  
  <!-- Barra de búsqueda -->
  <app-search 
    placeholder="Buscar productos por nombre o categoria..."
    [(terminoBusqueda)]="terminoBusqueda"
    (busquedaRealizada)="onBusqueda($event)">
  </app-search>

  <!-- Mensaje de carga -->
  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2">Cargando productos...</p>
  </div>

  <!-- Lista de productos -->
  <div *ngIf="!cargando && productosFiltrados.length > 0">
    <div class="row g-3">
      <div class="col-12 col-sm-6 col-lg-4" *ngFor="let p of productosFiltrados">
        <app-card-producto
          [id]="p.id"
          [nombre]="p.nombre"
          [categoria]="p.categoria"
          [precio]="p.precio"
          [imagen]="p.imagen">
          
          <!-- Botones exclusivos para clientes -->
          <ng-container *ngIf="userRole === 'cliente'">
            <!-- Solo mostrar botón si el usuario está activo -->
            <button 
              *ngIf="puedeAgregar()" 
              class="btn btn-success" 
              (click)="agregarAlCarrito(p)">
              <i class="bi bi-cart-plus-fill"></i> Agregar
            </button>
            
            <!-- Mensaje si el usuario no puede agregar -->
            <div *ngIf="!puedeAgregar()" class="alert alert-warning p-2 mb-0 small">
              <i class="bi bi-exclamation-triangle"></i> 
              <span *ngIf="userEstado === 'pendiente'">Tu cuenta está pendiente de validación</span>
              <span *ngIf="userEstado === 'bloqueado'">Tu cuenta ha sido bloqueada</span>
            </div>
          </ng-container>
        </app-card-producto>
      </div>
    </div>

    <!-- Componente de paginación -->
    <app-pagination
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      [totalItems]="totalItems"
      (pageChange)="onPageChange($event)">
    </app-pagination>
  </div>

  <!-- Mensaje cuando no hay productos -->
  <div *ngIf="!cargando && productosFiltrados.length === 0" class="alert alert-info text-center">
    <i class="bi bi-info-circle"></i> 
    <span *ngIf="terminoBusqueda">No se encontraron productos con "{{ terminoBusqueda }}"</span>
    <span *ngIf="!terminoBusqueda">No hay productos disponibles en este momento.</span>
  </div>
</div>
