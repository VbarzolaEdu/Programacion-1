<app-navbar></app-navbar>

<app-header titulo="Menú"></app-header>

<div class="container mt-3 mb-5 pb-5">
  <div class="row g-3">
    <div class="col-12 col-sm-6 col-lg-4" *ngFor="let p of productos">
      <app-card-producto
        [id]="p.id"
        [nombre]="p.nombre"
        [categoria]="p.categoria"
        [precio]="p.precio"
        [imagen]="p.imagen">
        
        <button class="btn btn-primary" (click)="irAHacerPedido(p.id)">
          <i class="bi bi-bag-fill"></i> Pedir
        </button>
        <button class="btn btn-success" (click)="agregarAlCarrito(p.id)">
          <i class="bi bi-cart-plus-fill"></i> Agregar
        </button>
      </app-card-producto>
    </div>
  </div>
</div>
