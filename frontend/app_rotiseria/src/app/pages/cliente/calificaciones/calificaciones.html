<app-navbar></app-navbar>

<app-header titulo="Calificaciones"></app-header>

<div class="container mt-3 mb-5 pb-5">
  
  <!-- Mensaje de carga -->
  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2">Cargando calificaciones...</p>
  </div>

  <!-- Lista de calificaciones -->
  <div *ngIf="!cargando && calificaciones.length > 0">
    <div *ngFor="let c of calificaciones" class="card mb-3 p-3 shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <strong>{{ c.usuario }}</strong>
        <small class="text-muted">{{ c.fecha | date:'short' }}</small>
      </div>
      
      <!-- Mostrar producto si existe -->
      <div *ngIf="c.producto" class="mb-1">
        <small class="text-muted">Producto: <span class="fw-semibold">{{ c.producto }}</span></small>
      </div>
      
      <p class="mb-2">{{ c.comentario }}</p>
      
      <!-- Estrellas -->
      <div class="text-warning">
        <i *ngFor="let estrella of getEstrellas(c.estrellas)" 
           class="bi" 
           [ngClass]="estrella <= c.estrellas ? 'bi-star-fill' : 'bi-star'">
        </i>
      </div>
    </div>
  </div>

  <!-- Mensaje cuando no hay calificaciones -->
  <div *ngIf="!cargando && calificaciones.length === 0" class="alert alert-info text-center">
    <i class="bi bi-info-circle"></i> 
    No hay calificaciones registradas aún.
  </div>
</div>
