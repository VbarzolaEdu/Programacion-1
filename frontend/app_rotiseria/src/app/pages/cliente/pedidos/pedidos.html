<app-navbar></app-navbar>
<app-header titulo="Mis pedidos"></app-header>

<div class="container mt-3 mb-5 pb-5">
  
  <!-- Mensaje de carga -->
  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2">Cargando tus pedidos...</p>
  </div>

  <!-- Lista de pedidos -->
  <div *ngIf="!cargando && pedidosFiltrados.length > 0">
    <div *ngFor="let p of pedidosFiltrados" class="mb-3">
      <app-card-pedido
        [id]="p.id"
        [fecha]="p.fecha"
        [total]="p.total"
        [estado]="p.estado"
        [nombreProducto]="p.nombre"
        [imagen]="p.imagen">
        
        <!-- Información extra específica del cliente -->
        <div extra-info>
          <h5 class="mb-2">{{ p.nombre }}</h5>
        </div>

        <!-- Botones de acción -->
        <div class="d-flex gap-2 flex-wrap mt-2">
          
          <!-- Botón calificar: Solo visible cuando el pedido está listo -->
          <button 
            *ngIf="p.estado && p.estado.trim().toLowerCase() === 'listo'"
            class="btn btn-outline-success btn-sm" 
            (click)="irAValorar(p.id)"
            type="button"
            title="Calificar este pedido">
            <i class="bi bi-star"></i> Calificar
          </button>
          
        </div>
        
      </app-card-pedido>
    </div>

    <!-- Componente de paginación -->
    <app-pagination
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      [totalItems]="totalItems"
      (pageChange)="onPageChange($event)">
    </app-pagination>
  </div>

  <!-- Mensaje cuando no hay pedidos -->
  <div *ngIf="!cargando && pedidosFiltrados.length === 0" class="alert alert-info text-center">
    <i class="bi bi-info-circle"></i> 
    No tienes pedidos registrados aún.
  </div>
</div>
