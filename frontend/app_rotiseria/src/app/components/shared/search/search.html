<div class="input-group mb-3">
  <input 
    type="text" 
    class="form-control" 
    [placeholder]="placeholder"
    [(ngModel)]="terminoBusqueda"
    (input)="onInputChange()"
    (keyup.enter)="buscar()">
  <button class="btn btn-outline-secondary" (click)="buscar()">
    <i class="bi bi-search"></i>
  </button>
</div>
